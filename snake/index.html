<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Kode Snake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. The 410x502 "screen" is exactly the Kode Dot panel; everything under it is phone-only. */
:root {
  --void: #000000;       /* AMOLED black: pixels off */
  --ink: #f2ebe0;        /* warm off-white text */
  --dim: #7d7266;        /* labels */
  --line: #2a2420;       /* walls, panel borders */
  --amber: #ffb627;      /* snake head, accents */
  --ember: #b8461b;      /* snake tail */
  --berry: #ff5c8a;      /* food */
  --panel: #0e0c0b;
  --font-display: "Silkscreen", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --font-ui: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--void); color: var(--ink); }
body {
  margin: 0;
  font: 14px/1.45 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 32px;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
}
main { width: 100%; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.screen {
  position: relative;
  width: 100%; max-width: 100%;
  aspect-ratio: 410 / 502;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--line), 0 0 0 7px #0a0908, 0 0 0 8px var(--line);
  touch-action: none;
}
.screen canvas { display: block; width: 100%; height: 100%; }

/* D-pad */
.pad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 56px); gap: 6px; justify-content: center; touch-action: none; }
.pad button {
  border: 1px solid var(--line); background: var(--panel); color: var(--dim);
  border-radius: 14px; font: 18px var(--font-display); cursor: pointer;
}
.pad button:active, .pad button.hit { background: #1d1813; color: var(--amber); border-color: #4a3a22; }
.pad .u { grid-column: 2; grid-row: 1; } .pad .l { grid-column: 1; grid-row: 2; }
.pad .r { grid-column: 3; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 3; }
.pad .c { grid-column: 2; grid-row: 2; font-size: 11px; letter-spacing: .06em; }

/* Test bench */
.bench { border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; background: var(--panel); }
.bench-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.bench h2 { margin: 0; font: 11px var(--font-display); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
.bench-body { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; }
.row label, .row .lbl { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row small { color: var(--dim); font-size: 12px; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: #241f1b; border: 1px solid var(--line); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--dim); transition: transform .15s, background .15s; }
.switch input:checked + span { background: #3a2a10; border-color: #6b4c17; }
.switch input:checked + span::after { transform: translateX(20px); background: var(--amber); }
.switch input:focus-visible + span { outline: 2px solid var(--amber); outline-offset: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
.seg button { background: transparent; color: var(--dim); border: 0; padding: 7px 10px; font: 13px var(--font-ui); cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: #2a2012; color: var(--amber); }
.btn { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; font: 13px var(--font-ui); cursor: pointer; }
.btn:focus-visible, .seg button:focus-visible, .pad button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.ghost { color: var(--dim); }
.hint { margin: 0; color: var(--dim); font-size: 12px; }
.hint b { color: var(--ink); font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .switch span, .switch span::after { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="screen" id="screen"><canvas id="cv" width="410" height="502" aria-label="Snake board"></canvas></div>

  <div class="pad" id="pad">
    <button class="u" data-d="0" aria-label="Up">▲</button>
    <button class="l" data-d="3" aria-label="Left">◀</button>
    <button class="c" id="padMid" aria-label="Start or pause">GO</button>
    <button class="r" data-d="1" aria-label="Right">▶</button>
    <button class="d" data-d="2" aria-label="Down">▼</button>
  </div>

  <section class="bench" aria-label="Test bench">
    <div class="bench-head">
      <h2>Test bench</h2>
      <button class="btn ghost" id="benchToggle" aria-expanded="true">Hide</button>
    </div>
    <div class="bench-body" id="benchBody">
      <div class="row">
        <label for="autoSw">Autopilot<small>Stand-in for the Kode Dot button combo</small></label>
        <span class="switch"><input type="checkbox" id="autoSw" role="switch"><span></span></span>
      </div>
      <div class="row">
        <span class="lbl">Autopilot speed<small>Full clear is ~10,000 moves</small></span>
        <div class="seg" id="speedSeg" role="group" aria-label="Autopilot speed">
          <button data-s="1" aria-pressed="true">1×</button><button data-s="2" aria-pressed="false">2×</button><button data-s="4" aria-pressed="false">4×</button><button data-s="16" aria-pressed="false">16×</button>
        </div>
      </div>
      <div class="row">
        <label for="tellSw">Show tell<small>Tiny amber dot top-right while auto is on</small></label>
        <span class="switch"><input type="checkbox" id="tellSw" role="switch"><span></span></span>
      </div>
      <div class="row">
        <span class="lbl">Board<small>16 × 17 · 272 cells</small></span>
        <button class="btn" id="newGame">New game</button>
      </div>
      <p class="hint">Secret switch: <b>triple-tap the score</b> (or press <b>K K K</b> on a keyboard). While auto drives, your swipes are ignored, so swipe away and look busy.</p>
    </div>
  </section>
</main>

<script src="snake-core.js"></script>
<script>
(function () {
  'use strict';
  var W = 16, H = 17, N = W * H;
  var SW = 410, SH = 502;                    // Kode Dot panel, portrait
  var CELL = 25, BX = 5, BY = 66;            // board: 400 x 425 px
  var HUD = 56;

  var C = {
    void: '#000000', ink: '#f2ebe0', dim: '#7d7266', line: '#2a2420',
    amber: [255, 182, 39], ember: [184, 70, 27], berry: '#ff5c8a', dot: '#16120f'
  };

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var game = new SnakeCore.Game(W, H);
  var pilot = new SnakeCore.Autopilot(game);
  var auto = false, tell = false, speed = 1;
  var best = 0, acc = 0, last = 0, playMs = 0;

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  best = +store('ks.best') || 0;
  tell = store('ks.tell') === '1';
  speed = +store('ks.speed') || 1;

  /* ---------- sizing ---------- */
  function fit() {
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = SW * dpr; cv.height = SH * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();
  window.addEventListener('resize', fit);

  /* ---------- timing ---------- */
  function interval() {
    var base = Math.max(72, 140 - (game.snake.length - 3) * 0.6);
    return auto ? base / speed : base;
  }

  /* ---------- control ---------- */
  function start() {
    if (game.status === 'ready') { game.status = 'playing'; return true; }
    if (game.status === 'paused') { game.status = 'playing'; return true; }
    if (game.status === 'dead' || game.status === 'won') { newGame(); game.status = 'playing'; return true; }
    return false;
  }
  function newGame() { game.reset(); pilot.reset(); acc = 0; playMs = 0; }
  function pause() { if (game.status === 'playing') game.status = 'paused'; else if (game.status === 'paused') game.status = 'playing'; }
  function steer(d) {
    if (game.status !== 'playing') { if (game.status === 'ready' || game.status === 'paused') start(); else return; }
    if (auto) return;                        // auto is driving: let them swipe for show
    game.turn(d);
  }
  function setAuto(on) {
    auto = on;
    document.getElementById('autoSw').checked = on;
    if (on) pilot.reset();
  }

  /* ---------- keyboard ---------- */
  var KEYS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
  var kTimes = [];
  window.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|BUTTON/.test(e.target.tagName) && e.code === 'Space') return;
    if (e.code in KEYS) { e.preventDefault(); steer(KEYS[e.code]); return; }
    if (e.code === 'Space') { e.preventDefault(); if (!start()) pause(); return; }
    if (e.code === 'Enter') { newGame(); return; }
    if (e.code === 'KeyK') {
      var now = performance.now();
      kTimes = kTimes.filter(function (t) { return now - t < 1200; });
      kTimes.push(now);
      if (kTimes.length >= 3) { kTimes = []; setAuto(!auto); }
    }
  });

  /* ---------- touch: swipe anywhere on the screen ---------- */
  var screen = document.getElementById('screen');
  var t0 = null, moved = false, taps = [];
  function toLogical(touch) {
    var r = screen.getBoundingClientRect();
    return { x: (touch.clientX - r.left) * SW / r.width, y: (touch.clientY - r.top) * SH / r.height, cx: touch.clientX, cy: touch.clientY };
  }
  screen.addEventListener('touchstart', function (e) { e.preventDefault(); t0 = toLogical(e.touches[0]); moved = false; }, { passive: false });
  screen.addEventListener('touchmove', function (e) {
    e.preventDefault();
    if (!t0) return;
    var p = toLogical(e.touches[0]), dx = p.cx - t0.cx, dy = p.cy - t0.cy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    t0 = p; moved = true;                     // chain swipes without lifting
  }, { passive: false });
  screen.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (t0 && !moved) tap(t0.x, t0.y);
    t0 = null;
  }, { passive: false });
  screen.addEventListener('mousedown', function (e) {
    var r = screen.getBoundingClientRect();
    tap((e.clientX - r.left) * SW / r.width, (e.clientY - r.top) * SH / r.height);
  });

  function tap(x, y) {
    if (y < HUD && x < 160) {                 // score area: secret triple-tap
      var now = performance.now();
      taps = taps.filter(function (t) { return now - t < 900; });
      taps.push(now);
      if (taps.length >= 3) { taps = []; setAuto(!auto); }
      return;
    }
    if (game.status !== 'playing') start();
  }

  /* ---------- D-pad ---------- */
  var pad = document.getElementById('pad');
  pad.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    e.preventDefault();
    b.classList.add('hit'); setTimeout(function () { b.classList.remove('hit'); }, 120);
    if (b.id === 'padMid') { if (!start()) pause(); return; }
    steer(+b.dataset.d);
  });

  /* ---------- bench ---------- */
  document.getElementById('autoSw').addEventListener('change', function (e) { setAuto(e.target.checked); });
  var tellSw = document.getElementById('tellSw');
  tellSw.checked = tell;
  tellSw.addEventListener('change', function (e) { tell = e.target.checked; store('ks.tell', tell ? '1' : '0'); });
  var seg = document.getElementById('speedSeg');
  function paintSeg() { [].forEach.call(seg.children, function (b) { b.setAttribute('aria-pressed', String(+b.dataset.s === speed)); }); }
  paintSeg();
  seg.addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; speed = +b.dataset.s; store('ks.speed', String(speed)); paintSeg(); });
  document.getElementById('newGame').addEventListener('click', function () { newGame(); });
  var benchBody = document.getElementById('benchBody'), benchToggle = document.getElementById('benchToggle');
  function setBench(open) { benchBody.hidden = !open; benchToggle.textContent = open ? 'Hide' : 'Show'; benchToggle.setAttribute('aria-expanded', String(open)); store('ks.bench', open ? '1' : '0'); }
  setBench(store('ks.bench') !== '0');
  benchToggle.addEventListener('click', function () { setBench(benchBody.hidden); });

  document.addEventListener('visibilitychange', function () { if (document.hidden && game.status === 'playing') game.status = 'paused'; });

  /* ---------- loop ---------- */
  function frame(ts) {
    var dt = last ? Math.min(250, ts - last) : 0;
    last = ts;
    if (game.status === 'playing') {
      playMs += dt;
      acc += dt;
      var iv = interval(), guard = 0;
      while (acc >= iv && game.status === 'playing' && guard++ < 40) {
        acc -= iv;
        game.step(auto ? pilot.decide() : null);
        iv = interval();
      }
      if (game.status !== 'playing') acc = 0;
      if (game.score > best) { best = game.score; store('ks.best', String(best)); }
    }
    draw(ts);
    requestAnimationFrame(frame);
  }

  /* ---------- drawing ---------- */
  function pad3(n) { return String(n).padStart(3, '0'); }
  function mix(a, b, t) { return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * t) + ',' + Math.round(a[1] + (b[1] - a[1]) * t) + ',' + Math.round(a[2] + (b[2] - a[2]) * t) + ')'; }
  function cellXY(c) { return [BX + (c % W) * CELL, BY + ((c / W) | 0) * CELL]; }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); ctx.fill(); }
  function clock(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

  function draw(ts) {
    ctx.fillStyle = C.void; ctx.fillRect(0, 0, SW, SH);

    // HUD
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = C.dim; ctx.font = '10px ' + 'Silkscreen, monospace';
    ctx.textAlign = 'left'; ctx.fillText('SCORE', 14, 20);
    ctx.textAlign = 'right'; ctx.fillText('BEST', SW - 14, 20);
    ctx.textAlign = 'center'; ctx.fillText('CELLS', SW / 2, 20);
    ctx.fillStyle = C.ink; ctx.font = '24px Silkscreen, monospace';
    ctx.textAlign = 'left'; ctx.fillText(pad3(game.score), 12, 46);
    ctx.textAlign = 'right'; ctx.fillText(pad3(Math.max(best, game.score)), SW - 12, 46);
    ctx.font = '14px Silkscreen, monospace'; ctx.textAlign = 'center';
    ctx.fillText(game.snake.length + '/' + N, SW / 2, 44);

    // fill bar: how much of the board the snake covers
    var fill = game.snake.length / N;
    ctx.fillStyle = C.line; ctx.fillRect(BX, 56, W * CELL, 2);
    ctx.fillStyle = mix(C.ember, C.amber, fill); ctx.fillRect(BX, 56, W * CELL * fill, 2);

    if (auto && tell) { ctx.fillStyle = 'rgb(' + C.amber.join(',') + ')'; ctx.beginPath(); ctx.arc(SW - 6, 6, 2.5, 0, Math.PI * 2); ctx.fill(); }

    // walls
    ctx.strokeStyle = C.line; ctx.lineWidth = 1;
    ctx.strokeRect(BX - 0.5, BY - 0.5, W * CELL + 1, H * CELL + 1);

    // grid dots
    ctx.fillStyle = C.dot;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) ctx.fillRect(BX + x * CELL + 11, BY + y * CELL + 11, 3, 3);

    // food
    if (game.food >= 0 && game.status !== 'won') {
      var f = cellXY(game.food), pulse = 0.5 + 0.5 * Math.sin(ts / 220);
      ctx.fillStyle = 'rgba(255,92,138,' + (0.12 + 0.12 * pulse) + ')';
      ctx.beginPath(); ctx.arc(f[0] + CELL / 2, f[1] + CELL / 2, 11 + 2 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.berry;
      ctx.beginPath(); ctx.arc(f[0] + CELL / 2, f[1] + CELL / 2, 7, 0, Math.PI * 2); ctx.fill();
    }

    // snake: tail first so the head sits on top
    var s = game.snake, L = s.length, IN = 3;
    for (var k = L - 1; k >= 0; k--) {
      var p = cellXY(s[k]);
      ctx.fillStyle = mix(C.amber, C.ember, L > 1 ? k / (L - 1) : 0);
      rr(p[0] + IN, p[1] + IN, CELL - 2 * IN, CELL - 2 * IN, 6);
      if (k > 0) {                              // bridge to the next segment
        var q = cellXY(s[k - 1]);
        var bx = Math.min(p[0], q[0]) + IN, by = Math.min(p[1], q[1]) + IN;
        var bw = Math.abs(p[0] - q[0]) + CELL - 2 * IN, bh = Math.abs(p[1] - q[1]) + CELL - 2 * IN;
        ctx.fillRect(bx + (p[0] === q[0] ? 0 : 4), by + (p[1] === q[1] ? 0 : 4), bw - (p[0] === q[0] ? 0 : 8), bh - (p[1] === q[1] ? 0 : 8));
      }
    }
    // eyes
    var hp = cellXY(s[0]), cx = hp[0] + CELL / 2, cy = hp[1] + CELL / 2, d = game.dir;
    var fx = SnakeCore.DX[d], fy = SnakeCore.DY[d];
    ctx.fillStyle = C.void;
    [-1, 1].forEach(function (side) {
      ctx.beginPath();
      ctx.arc(cx + fx * 4 + -fy * side * 5, cy + fy * 4 + fx * side * 5, 2.2, 0, Math.PI * 2);
      ctx.fill();
    });

    // overlays
    var st = game.status;
    if (st === 'ready') banner('SWIPE TO START', 'Clear all ' + N + ' cells to win', ts);
    else if (st === 'paused') banner('PAUSED', 'Tap or swipe to carry on', ts);
    else if (st === 'dead') banner(game.deathReason === 'wall' ? 'HIT THE WALL' : 'BIT YOURSELF', 'Score ' + game.score + ' · tap to go again', ts);
    else if (st === 'won') banner('BOARD CLEARED', N + '/' + N + ' in ' + clock(playMs) + ' · tap for another', ts);
  }

  function banner(title, sub, ts) {
    var cy = BY + CELL * 4.5;                // upper board, clear of the start position
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(BX, cy - 46, W * CELL, 92);
    ctx.fillStyle = game.status === 'won' ? 'rgb(' + C.amber.join(',') + ')' : C.ink;
    ctx.font = '26px Silkscreen, monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(title, SW / 2, cy - 10);
    ctx.fillStyle = C.dim; ctx.font = '13px "IBM Plex Mono", monospace';
    ctx.fillText(sub, SW / 2, cy + 22);
    ctx.textBaseline = 'alphabetic';
  }

  var ready = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('24px Silkscreen'), document.fonts.load('13px "IBM Plex Mono"')]) : Promise.resolve();
  ready.catch(function () {}).then(function () { requestAnimationFrame(frame); });
})();
</script>
</body>
</html>
