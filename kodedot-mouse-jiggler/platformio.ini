; ==============================================================
; Mouse Jiggler for Kode Dot (ESP32-S3)
; Builds an Arduino app and flashes it to the kodeOS app slot
; at 0x400000 (bootloader / kodeOS launcher are left untouched).
; ==============================================================
[platformio]
default_envs = kode_dot

[env:kode_dot]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = kode_dot
framework = arduino
app_name = MouseJiggler
lib_compat_mode = off
lib_ldf_mode = chain
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

build_flags =
    -I src
    ; kodeOS convention: never mark the app valid / cancel rollback
    -Wl,--wrap=esp_ota_mark_app_valid_cancel_rollback
    -DLV_CONF_INCLUDE_SIMPLE
    -Wno-deprecated-declarations
    -Wno-cpp

extra_scripts = pre:extra_scripts/auto_port.py, pre:extra_scripts/rename_bin.py

upload_protocol = custom
upload_port = auto
monitor_port = auto
upload_speed = 460800
upload_command = esptool --chip esp32s3 --port ${UPLOAD_PORT} --baud ${UPLOAD_SPEED} write-flash --flash-freq 80m --flash-mode dio --flash-size 32MB 0x400000 ${BUILD_DIR}/${PROGNAME}.bin

lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    lvgl/lvgl @ ~9.2.2
    https://github.com/bitbank2/bb_captouch.git
    https://github.com/RobTillaart/TCA9555.git#0.4.3
    adafruit/Adafruit NeoPixel @ ^1.12.0
